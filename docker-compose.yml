services:
  db:
    image: postgres:17
    container_name: mindjunkies-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mindjunkies
      - POSTGRES_PASSWORD=mindjunkies
      - POSTGRES_DB=mindjunkies
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2
    container_name: mindjunkies-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    entrypoint: redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s



  mindjunkies:
    container_name: mindjunkies-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - UV_PROJECT_ENVIRONMENT=/venv
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    entrypoint: ["sh", "-c", "/app/migrate.sh && /app/entrypoint.sh"]

volumes:
  db_data:
  redis_data:
